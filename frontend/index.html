<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledgermancy</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- iOS ignores the manifest's icons entirely and reads this instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The manifest link is injected by vite-plugin-pwa; it is generated from
         the `manifest` block in vite.config.ts so the icon list and the brand
         colours have exactly one source. -->
    <meta name="theme-color" content="#07060d" />
    <!-- Standalone on iOS, matching the manifest's display mode. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ledgermancy" />
    <meta name="description" content="A self-hosted hub for your household's finances." />
    <!-- Self-hosted type (see index.css @font-face). Preload the UI face and the
         default money weight so first paint isn't a flash of the system stack;
         the bold money weight is fetched on demand. -->
    <link rel="preload" href="/fonts/sora-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
